name: Build Xray minimal for Cudy WR3000

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-xray-minimal.sh'
      - '.github/workflows/build.yml'

jobs:
  build-xray:
    name: Build Xray (VLESS + XHTTP only)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build minimal xray for aarch64
        run: bash scripts/build-xray-minimal.sh

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-aarch64-minimal
          path: xray
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xray-${{ github.run_number }}
          name: Xray minimal (VLESS+XHTTP) — build ${{ github.run_number }}
          body: |
            Minimal xray-core for Cudy WR3000 v1 (aarch64).
            Only VLESS + XHTTP + Reality + fakedns. UPX compressed.

            ### Install on router
            ```sh
            scp xray root@192.168.10.1:/usr/bin/xray
            chmod +x /usr/bin/xray
            ```
          files: xray
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
